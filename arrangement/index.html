<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What’s Missing?</title>
  <link rel="stylesheet" href="style.css">
  <script src="sound.js" defer></script>
  <script src="visuals.js" defer></script>
  <script type="module" src="hand-cursor.js"></script>
</head>
<body>
  <main>
    <section id="waiting" class="waiting" aria-labelledby="waiting-title">
      <div class="waiting-content">
        <h1 id="waiting-title" lang="en">What’s<br>Missing?</h1>
        <p id="waiting-status" role="status">운영자는 Space 또는 Enter를 눌러 오디오를 켜 주세요.</p>
        <div class="tape-deck" aria-hidden="true">
            <div class="cassette">
              <i class="screw"></i><i class="screw"></i><i class="screw"></i><i class="screw"></i>
              <div class="tape-window"><div class="reel"></div><div class="reel"></div></div>
              <div class="tape-head"><i></i><i></i><i></i></div>
            </div>
          </div>
        <p id="hand-ready" hidden>손이 인식되었습니다.</p>
        <div class="transport waiting-actions">
          <button id="enter" type="button" lang="en">START</button>
          <button id="waiting-original" type="button">원곡 듣기</button>
        </div>
      </div>
    </section>

    <section id="mixer" class="mixer" aria-labelledby="mixer-title" hidden>
      <header class="machine-header">
        <h1 id="mixer-title" lang="en">What’s Missing?</h1>
        <div class="transport mixer-controls">
          <span class="play-state" lang="en">PLAY</span>
          <span class="countdown"><time id="remaining" role="timer" aria-label="남은 시간"></time></span>
          <button id="original" type="button">원곡 듣기</button>
          <button id="finish" type="button" lang="en">FINISH</button>
        </div>
      </header>

      <div class="machine-body">
        <div class="tape-deck" aria-hidden="true">
            <div class="cassette">
              <i class="screw"></i><i class="screw"></i><i class="screw"></i><i class="screw"></i>
              <div class="tape-window"><div class="reel"></div><div class="reel"></div></div>
              <div class="tape-head"><i></i><i></i><i></i></div>
            </div>
          </div>
        <section class="tracks" aria-label="소리 조작"></section>
      </div>
      <footer class="machine-footer">
        <span>짧게 집기 <b>ON/OFF</b></span>
        <span>집은 채 위아래로 <b>볼륨</b></span>
        <span><b>FINISH</b> 1.5초 가리키기</span>
      </footer>
    </section>

    <section id="result" class="result" aria-labelledby="result-title" hidden>
      <div class="result-content">
        <h1 id="result-title" tabindex="-1">체험 완료</h1>
        <ul id="result-tracks" class="result-tracks" aria-label="마지막 소리 조합"></ul>
        <p id="result-empty" hidden>선택한 소리가 없습니다.</p>
      </div>
    </section>

    <template id="result-track-template">
      <li class="result-track">
        <span class="result-suit" aria-hidden="true"></span>
        <span class="name" lang="en"></span>
        <span class="amount"></span>
      </li>
    </template>
    <template id="track-template">
      <article class="track">
        <span class="grab-status" lang="en" hidden>GRABBED</span>
        <button class="toggle" type="button" aria-pressed="false" disabled>
          <span class="name" lang="en"></span>
          <span class="state" aria-hidden="true">OFF</span>
        </button>
        <div class="channel-controls">
          <canvas class="stem-visual" width="24" height="160" aria-hidden="true"></canvas>
          <div class="level">
          <span class="level-limit" aria-hidden="true">100</span>
          <input class="volume" type="range" min="0" max="100" value="100" aria-orientation="vertical" disabled>
          <span class="level-limit" aria-hidden="true">0</span>
          </div>
        </div>
        <output class="amount" aria-hidden="true">100%</output>
      </article>
    </template>
  </main>
  <div class="hand-cursor" data-hand="Left" aria-hidden="true" hidden><span>L</span></div>
  <div class="hand-cursor" data-hand="Right" aria-hidden="true" hidden><span>R</span></div>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What’s Missing?</title>
  <link rel="stylesheet" href="style.css">
  <script src="sound.js" defer></script>
  <script type="module" src="hand-cursor.js"></script>
</head>
<body>
  <main>
    <section id="waiting" class="waiting" aria-labelledby="waiting-title">
      <div class="waiting-content">
        <h1 id="waiting-title" lang="en">What’s<br>Missing?</h1>
        <p id="waiting-status" role="status">마우스로 소리를 조합해 보세요.</p>
        <div class="waiting-suits" aria-hidden="true">
          <span class="suit">♣︎</span>
          <span class="suit">♠︎</span>
          <span class="suit">♦︎</span>
          <span class="suit">♥︎</span>
        </div>
        <div class="transport waiting-actions">
          <button id="enter" type="button">시작</button>
          <button id="waiting-original" type="button">원곡 듣기</button>
        </div>
      </div>
    </section>

    <section id="mixer" class="mixer" aria-labelledby="mixer-title" hidden>
      <header>
        <h1 id="mixer-title" lang="en">What’s Missing?</h1>
        <p>문양을 눌러 소리를 켜고, 막대로 볼륨을 조절하세요.</p>
      </header>

      <div class="transport mixer-controls">
        <span class="countdown">남은 시간 <time id="remaining" role="timer"></time></span>
        <button id="original" type="button">원곡 듣기</button>
        <button id="finish" type="button">마치기</button>
      </div>

      <section class="tracks" aria-label="소리 조작"></section>
    </section>

    <section id="result" class="result" aria-labelledby="result-title" hidden>
      <div class="result-content">
        <h1 id="result-title" tabindex="-1">체험 완료</h1>
        <ul id="result-tracks" class="result-tracks" aria-label="마지막 소리 조합"></ul>
        <p id="result-empty" hidden>선택한 소리가 없습니다.</p>
      </div>
    </section>

    <template id="result-track-template">
      <li class="result-track">
        <span class="result-suit" aria-hidden="true"></span>
        <span class="name" lang="en"></span>
        <span class="amount"></span>
      </li>
    </template>
    <template id="track-template">
      <article class="track">
        <button class="toggle" type="button" aria-pressed="false" disabled>
          <span class="suit" aria-hidden="true"></span>
          <span class="name" lang="en"></span>
          <span class="state" aria-hidden="true">OFF</span>
        </button>
        <div class="level">
          <input class="volume" type="range" min="0" max="100" value="100" aria-orientation="vertical" disabled>
          <output class="amount" aria-hidden="true">100%</output>
        </div>
      </article>
    </template>
  </main>
  <div class="hand-cursor" aria-hidden="true" hidden></div>
</body>
</html>
